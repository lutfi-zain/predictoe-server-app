name: Build & Release APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
      - '*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      tag_name:
        description: 'Release Tag Name (optional, e.g. 0.0.1 - uploads APK to this release if provided)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Environment (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEY_PASS="${KEY_PASSWORD:-android}"
          STORE_PASS="${KEYSTORE_PASSWORD:-android}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan keystore rahasia dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "Membuat fallback upload keystore untuk release build..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=IDCloudVM, OU=Mobile, O=IDCloudHost, L=Jakarta, C=ID"
          fi

      - name: Build APK with Gradle
        env:
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          export STORE_PASSWORD="${STORE_PASSWORD_SECRET:-android}"
          export KEY_PASSWORD="${KEY_PASSWORD_SECRET:-android}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Package & Locate APK
        id: locate_apk
        run: |
          TARGET_TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}"
          [ -z "$TARGET_TAG" ] && TARGET_TAG="manual"
          SAFE_TAG=$(echo "$TARGET_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
          
          # Cari file APK yang berhasil di-build
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi
          
          OUTPUT_NAME="idcloud-vm-${SAFE_TAG}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "APK berhasil disiapkan di $OUTPUT_NAME (dari $APK_PATH)"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT
          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idcloud-vm-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          tag_name: ${{ steps.locate_apk.outputs.target_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
